[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "croplogic-notebooks"
version = "0.1.0"
description = "Minimal CropLogic inference notebook and support code"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "geopandas",
  "ipyleaflet",
  "ipywidgets",
  "openeo",
  "openeo-gfmap",
  "Pillow",
  "rasterio",
  "shapely",
  "worldcereal",
]

[project.optional-dependencies]
notebook = ["ipykernel", "jupyterlab"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
croplogic = ["openeo/*.py", "data/*.geojson"]
